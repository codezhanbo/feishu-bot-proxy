<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封禁查询 · feishu-bot-proxy</title>
<link rel="stylesheet" href="/layout.css">
<style>
  .form { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .form label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:5px; }
  .form input[type=text], .form select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .form input:focus, .form select:focus { outline:none; border-color:var(--accent); }
  #result table { border-collapse:collapse; width:100%; }
  #result td { padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  #result td.k { color:var(--muted); width:110px; }
  #msg { min-height:18px; font-size:13px; color:var(--bad); }
</style>
</head>
<body data-page="ban-check">
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="content">
      <section class="panel">
        <h2>封禁查询</h2>
        <p class="hint">查询 pubg.hk 记录的玩家封禁状态（数据来自 pubg.hk，非官方）。</p>
        <div class="form" style="margin-top:12px;">
          <label>玩家昵称<input type="text" id="player" placeholder="如 CN_A1xleft"></label>
          <label>平台
            <select id="platform">
              <option value="steam" selected>steam</option>
              <option value="kakao">kakao</option>
              <option value="console">console</option>
              <option value="xbox">xbox</option>
              <option value="psn">psn</option>
            </select>
          </label>
          <button class="primary" id="query">查询</button>
          <span id="msg"></span>
        </div>
        <p class="hint" style="margin-top:8px;">kakao / console 玩家若查不到，试试昵称前加 <code>#kakao-</code> / <code>#console-</code> 前缀（与官网一致）。</p>
      </section>

      <section class="panel" id="result" hidden>
        <h2>查询结果</h2>
        <div id="result-body"></div>
      </section>
    </main>
  </div>
<script>
  const $ = id => document.getElementById(id);

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  async function api(url) {
    const res = await fetch(url);
    if (res.status === 401) { location.replace('/login.html'); throw new Error('unauthorized'); }
    const j = await res.json().catch(() => null);
    if (!res.ok) {
      const e = new Error((j && j.msg) || ('HTTP ' + res.status));
      e.code = (j && j.code) || res.status;
      throw e;
    }
    return j;
  }

  function showResult(r) {
    const banned = r.banType && r.banType.toLowerCase() !== 'innocent';
    const statusBadge = banned
      ? '<span class="badge bad">' + esc(r.banStatus || '已封禁') + '</span>'
      : '<span class="badge ok">' + esc(r.banStatus || '未封禁') + '</span>';
    const rows = [
      ['玩家', esc(r.playerName || '—')],
      ['平台', esc(r.platform || '—')],
      ['状态', statusBadge],
      ['类型', esc(r.banType || '—')],
      ['对局数', r.matchCount == null ? '—' : String(r.matchCount)],
      ['总场次', r.totalMatches == null ? '—' : String(r.totalMatches)],
      ['等级', esc(r.level || '—')],
      ['siteUUID', '<span class="clip">' + esc(r.siteUUID || '—') + '</span>'],
    ];
    $('result-body').innerHTML = '<table>' + rows.map(r =>
      '<tr><td class="k">' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
  }

  function showError(msg) {
    $('result-body').innerHTML = '<div class="muted">' + esc(msg) + '</div>';
  }

  async function query() {
    const player = $('player').value.trim();
    const platform = $('platform').value;
    if (!player) { $('msg').textContent = '请输入玩家昵称'; return; }

    $('msg').textContent = '查询中…';
    $('result').hidden = true;
    try {
      const r = await api('/console/ban-check?player=' + encodeURIComponent(player) +
        '&platform=' + encodeURIComponent(platform));
      $('msg').textContent = '';
      $('result').hidden = false;
      if (r.success) showResult(r);
      else showError(r.error || '查询失败');
    } catch (e) {
      $('msg').textContent = '';
      $('result').hidden = false;
      showError(e.message);
    }
  }

  $('query').addEventListener('click', query);
  $('player').addEventListener('keydown', e => { if (e.key === 'Enter') query(); });
</script>
<script src="/layout.js"></script>
</body>
</html>
