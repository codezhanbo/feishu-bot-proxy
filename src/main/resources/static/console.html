<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息查询 · feishu-bot-proxy</title>
<link rel="stylesheet" href="/layout.css">
<style>
  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; background:var(--card);
             border:1px solid var(--line); border-radius:12px; padding:16px; }
  .filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:5px; }
  .filters input, .filters select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; min-width:120px; }
  .filters input:focus, .filters select:focus { outline:none; border-color:var(--accent); }
  .filters button { padding:8px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .filters button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .meta { margin:16px 2px; color:var(--muted); font-size:13px; }
  .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:auto; }
  thead th { position:sticky; top:0; }
  tbody tr { cursor:pointer; }
  .pager { display:flex; align-items:center; gap:12px; margin:16px 2px; }
  .pager button { padding:7px 16px; border:1px solid var(--line); background:var(--card); border-radius:8px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager span { font-size:13px; color:var(--muted); }
  .detail { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .detail h2 { margin:0 0 12px; font-size:15px; }
  .detail pre { background:#0f172a; color:#e2e8f0; padding:16px; border-radius:8px; overflow:auto; font-size:12px; line-height:1.5; }
</style>
</head>
<body data-page="console">
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="content">
      <section class="filters">
        <label>botKey<input id="botKey" placeholder="如 dev-group"></label>
        <label>结果
          <select id="success">
            <option value="">全部</option>
            <option value="true">成功</option>
            <option value="false">失败</option>
          </select>
        </label>
        <label>关键字<input id="keyword" placeholder="标题 / 正文 / 预览"></label>
        <label>起始时间<input type="datetime-local" id="from"></label>
        <label>结束时间<input type="datetime-local" id="to"></label>
        <label>每页条数
          <select id="limit">
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <button id="query">查询</button>
        <button id="reset" class="ghost">重置</button>
      </section>

      <div class="meta" id="meta"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>id</th><th>created_at(ms)</th><th>时间</th><th>botKey</th><th>类型</th><th>标题</th>
              <th>正文预览</th><th>body</th><th>大小(B)</th><th>IP</th><th>结果</th><th>code</th>
              <th>msg</th><th>results</th><th>stat_date</th><th>survival_level</th>
              <th>exp_gained</th><th>bp_gained</th><th>duration</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="19" class="muted">加载中…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <button id="prev">上一页</button>
        <span id="page"></span>
        <button id="next">下一页</button>
      </div>

      <section class="detail" id="detail" hidden>
        <h2>详情</h2>
        <pre id="detail-body"></pre>
      </section>
    </main>
  </div>
<script>
  let offset = 0;
  let lastCount = 0;
  const tbody = document.getElementById('tbody');

  function esc(s) {
    if (s === null || s === undefined) return '<span class="muted">—</span>';
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function buildParams() {
    const p = new URLSearchParams();
    const botKey = document.getElementById('botKey').value.trim();
    const success = document.getElementById('success').value;
    const keyword = document.getElementById('keyword').value.trim();
    const limit = document.getElementById('limit').value;
    if (botKey) p.set('botKey', botKey);
    if (success) p.set('success', success);
    if (keyword) p.set('keyword', keyword);
    const from = epochOf('from'), to = epochOf('to');
    if (from !== null) p.set('from', from);
    if (to !== null) p.set('to', to);
    p.set('limit', limit || '20');
    p.set('offset', offset);
    return p;
  }

  function epochOf(id) {
    const v = document.getElementById(id).value;
    return v ? new Date(v).getTime() : null;
  }

  async function load() {
    tbody.innerHTML = '<tr><td colspan="19" class="muted">加载中…</td></tr>';
    try {
      const res = await fetch('/console/logs?' + buildParams());
      if (res.status === 401) { location.replace('/login.html'); return; }
      const j = await res.json();
      render(j);
    } catch (ex) {
      tbody.innerHTML = '<tr><td colspan="19" class="muted">加载失败：' + esc(ex.message) + '</td></tr>';
    }
  }

  function render(j) {
    lastCount = j.count || 0;
    const limit = parseInt(document.getElementById('limit').value || '20', 10);
    const total = j.total ?? 0;
    const pages = Math.max(1, Math.ceil(total / limit));
    document.getElementById('meta').textContent =
      '总记录数 ' + total + ' · 总页数 ' + pages + ' · 本页 ' + lastCount + ' 条';

    if (!j.records || j.records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="19" class="muted">没有匹配的记录</td></tr>';
    } else {
      tbody.innerHTML = j.records.map(r => rowHtml(r)).join('');
    }

    document.getElementById('prev').disabled = offset <= 0;
    document.getElementById('next').disabled = lastCount < limit;
    document.getElementById('page').textContent = '第 ' + (offset / Math.max(1, limit) + 1) + ' / ' + pages + ' 页';
  }

  function statOf(r, key) {
    return (r.stats && r.stats[key] != null) ? r.stats[key] : null;
  }

  function rowHtml(r) {
    const ok = r.success;
    const badge = '<span class="badge ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '成功' : '失败') + '</span>';
    const results = r.results ? JSON.stringify(r.results) : null;
    return '<tr data-id="' + r.id + '">' +
      '<td>' + esc(r.id) + '</td>' +
      '<td>' + esc(r.epochMillis) + '</td>' +
      '<td>' + esc(r.time) + '</td>' +
      '<td>' + esc(r.botKeys) + '</td>' +
      '<td>' + esc(r.msgType) + '</td>' +
      '<td class="clip">' + esc(r.title) + '</td>' +
      '<td class="clip">' + esc(r.textPreview) + '</td>' +
      '<td class="clip">' + esc(r.body) + '</td>' +
      '<td>' + esc(r.bodyBytes) + '</td>' +
      '<td>' + esc(r.clientIp) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + esc(r.code) + '</td>' +
      '<td class="clip">' + esc(r.msg) + '</td>' +
      '<td class="clip">' + esc(results) + '</td>' +
      '<td>' + esc(statOf(r, 'statDate')) + '</td>' +
      '<td>' + esc(statOf(r, 'survivalLevel')) + '</td>' +
      '<td>' + esc(statOf(r, 'expGained')) + '</td>' +
      '<td>' + esc(statOf(r, 'bpGained')) + '</td>' +
      '<td>' + esc(statOf(r, 'duration')) + '</td>' +
      '</tr>';
  }

  function showDetail(r) {
    const view = Object.assign({}, r);
    if (typeof view.body === 'string') {
      try { view.body = JSON.parse(view.body); } catch (e) { /* 保留原字符串 */ }
    }
    document.getElementById('detail-body').textContent = JSON.stringify(view, null, 2);
    document.getElementById('detail').hidden = false;
    document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 事件绑定
  tbody.addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    const id = tr.getAttribute('data-id');
    fetch('/console/logs?' + buildParams()).then(r => r.json()).then(j => {
      const rec = (j.records || []).find(x => String(x.id) === id);
      if (rec) showDetail(rec);
    });
  });

  document.getElementById('query').addEventListener('click', () => { offset = 0; load(); });
  document.getElementById('reset').addEventListener('click', () => {
    ['botKey','keyword','from','to'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('success').value = '';
    document.getElementById('limit').value = '20';
    offset = 0;
    load();
  });
  document.getElementById('prev').addEventListener('click', () => {
    const n = Math.max(0, offset - parseInt(document.getElementById('limit').value || '20', 10));
    offset = n;
    load();
  });
  document.getElementById('next').addEventListener('click', () => {
    offset += parseInt(document.getElementById('limit').value || '20', 10);
    load();
  });

  load();
</script>
<script src="/layout.js"></script>
</body>
</html>
