<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>账号管理 · feishu-bot-proxy</title>
<link rel="stylesheet" href="/layout.css">
</head>
<body data-page="accounts">
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="content">
      <section class="panel">
        <div class="row" style="display:flex; justify-content:space-between; align-items:center;">
          <h2 style="margin:0;">我的账号</h2>
          <div style="display:flex; gap:10px;">
            <button class="ghost" id="batch-check">批量查询</button>
            <button class="primary" id="new">添加账号</button>
          </div>
        </div>
        <p class="hint" style="margin:8px 0 12px;">
          手动维护我的账号（账号ID 与等级）。封禁状态 / 最后查询时间 / 总场次会在对该账号执行
          <a href="/ban-check.html">封禁查询</a> 时自动更新。
        </p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>账号ID</th><th>平台</th><th>封禁状态</th><th>等级</th><th>最后查询时间</th><th>总场次</th><th></th></tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="form-panel" hidden>
        <h2 id="form-title">添加账号</h2>
        <div class="form">
          <label>账号ID<input type="text" id="f-accountId" placeholder="玩家昵称"></label>
          <label>平台
            <select id="f-platform">
              <option value="steam">steam</option>
              <option value="kakao">kakao</option>
              <option value="console">console</option>
              <option value="xbox">xbox</option>
              <option value="psn">psn</option>
            </select>
          </label>
          <label>等级（可选）<input type="text" id="f-level" placeholder="如 500"></label>
          <div class="form-buttons">
            <button class="primary" id="save">保存</button>
            <button class="ghost" id="cancel">取消</button>
            <span id="msg"></span>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>最近查询</h2>
        <div class="filters" style="margin-bottom:12px;">
          <label>玩家ID<input type="text" id="log-player" placeholder="模糊匹配"></label>
          <label>创建时间<input type="date" id="log-date"></label>
          <label>每页条数
            <select id="log-limit">
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button id="log-query">查询</button>
          <button id="log-reset" class="ghost">重置</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>时间</th><th>玩家</th><th>平台</th><th>结果</th><th>封禁状态</th><th>等级</th><th>总场次</th></tr>
            </thead>
            <tbody id="log-body"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
          </table>
        </div>
        <div class="meta" id="log-meta"></div>
        <div class="pager">
          <button id="log-prev">上一页</button>
          <span id="log-page"></span>
          <button id="log-next">下一页</button>
        </div>
      </section>
    </main>
  </div>
<script>
  let accounts = [];
  let editing = null;   // 正在编辑的 accountId，null 表示新建
  let logOffset = 0;    // 最近查询的分页偏移

  const $ = id => document.getElementById(id);

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function showMsg(text) { $('msg').textContent = text || ''; }

  async function api(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) { location.replace('/login.html'); throw new Error('unauthorized'); }
    const j = await res.json().catch(() => null);
    if (!res.ok) {
      const e = new Error((j && j.msg) || ('HTTP ' + res.status));
      e.code = (j && j.code) || res.status;
      throw e;
    }
    return j;
  }

  async function load() {
    await Promise.all([loadAccounts(), loadLogs()]);
  }

  async function loadAccounts() {
    const accountList = await api('/console/accounts').catch(() => null);
    accounts = (accountList && accountList.accounts) || [];
    renderTable();
  }

  function todayStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 一个自然日对应的 [from, to) 半开区间（epoch 毫秒，本地时区）。空日期 => 不限时间。
  function dayRange(dateStr) {
    if (!dateStr) return { from: null, to: null };
    const start = new Date(dateStr + 'T00:00:00');
    return { from: start.getTime(), to: start.getTime() + 86400000 };
  }

  function buildLogParams() {
    const p = new URLSearchParams();
    const player = $('log-player').value.trim();
    const range = dayRange($('log-date').value);
    if (player) p.set('player', player);
    if (range.from !== null) p.set('from', range.from);
    if (range.to !== null) p.set('to', range.to);
    p.set('limit', $('log-limit').value || '20');
    p.set('offset', logOffset);
    return p;
  }

  async function loadLogs() {
    const logList = await api('/console/ban-logs?' + buildLogParams()).catch(() => null);
    renderLogs(logList || {});
  }

  // 封禁状态分三档：正常(绿) / 临时封禁(橙) / 永久封禁(红)。
  function statusBadge(s) {
    if (!s) return '<span class="muted">—</span>';
    if (s.indexOf('永久') >= 0) return '<span class="badge bad">' + esc(s) + '</span>';
    if (s.indexOf('临时') >= 0) return '<span class="badge warn">' + esc(s) + '</span>';
    if (s === '正常' || s === '未封禁') return '<span class="badge ok">' + esc(s) + '</span>';
    return '<span class="badge bad">' + esc(s) + '</span>';
  }

  function renderTable() {
    const tbody = $('tbody');
    if (!accounts.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="muted">还没有账号，点「添加账号」</td></tr>';
      return;
    }
    tbody.innerHTML = accounts.map(a =>
      '<tr>' +
      '<td>' + esc(a.accountId) + '</td>' +
      '<td>' + esc(a.platform || 'steam') + '</td>' +
      '<td>' + statusBadge(a.banStatus) + '</td>' +
      '<td>' + esc(a.level || '—') + '</td>' +
      '<td>' + esc(a.lastCheckedAt || '—') + '</td>' +
      '<td>' + (a.totalMatches == null ? '—' : esc(a.totalMatches)) + '</td>' +
      '<td><button class="ghost" data-check="' + esc(a.accountId) + '">查询</button> ' +
      '<button class="ghost" data-edit="' + esc(a.accountId) + '">编辑</button> ' +
      '<button class="danger" data-del="' + esc(a.accountId) + '">删除</button></td>' +
      '</tr>').join('');
  }

  function renderLogs(j) {
    const records = j.records || [];
    const tbody = $('log-body');
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="muted">还没有查询记录</td></tr>';
    } else {
      tbody.innerHTML = records.map(r => {
        const ok = r.success
          ? '<span class="badge ok">成功</span>'
          : '<span class="badge bad">失败</span>';
        return '<tr>' +
          '<td>' + esc(r.queriedDatetime || '—') + '</td>' +
          '<td>' + esc(r.player) + '</td>' +
          '<td>' + esc(r.platform) + '</td>' +
          '<td>' + ok + '</td>' +
          '<td>' + statusBadge(r.banStatus) + '</td>' +
          '<td>' + esc(r.level || '—') + '</td>' +
          '<td>' + (r.totalMatches == null ? '—' : esc(r.totalMatches)) + '</td>' +
          '</tr>';
      }).join('');
    }

    const limit = parseInt($('log-limit').value || '20', 10);
    const total = j.total ?? 0;
    const pages = Math.max(1, Math.ceil(total / limit));
    const count = j.count ?? records.length;
    $('log-meta').textContent = '总记录数 ' + total + ' · 总页数 ' + pages + ' · 本页 ' + count + ' 条';
    $('log-prev').disabled = logOffset <= 0;
    $('log-next').disabled = count < limit;
    $('log-page').textContent = '第 ' + (logOffset / Math.max(1, limit) + 1) + ' / ' + pages + ' 页';
  }

  function openForm(account) {
    editing = account ? account.accountId : null;
    $('form-panel').hidden = false;
    $('form-title').textContent = account ? '编辑账号 ' + account.accountId : '添加账号';
    $('f-accountId').value = account ? account.accountId : '';
    $('f-accountId').disabled = !!account;   // 主键不可改
    $('f-level').value = account ? (account.level || '') : '';
    $('f-platform').value = account ? (account.platform || 'steam') : 'steam';
    showMsg('');
    $('form-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closeForm() {
    editing = null;
    $('form-panel').hidden = true;
    $('f-accountId').disabled = false;
  }

  async function save() {
    const accountId = $('f-accountId').value.trim();
    const level = $('f-level').value.trim();
    const platform = $('f-platform').value;
    if (!accountId) { showMsg('请输入账号ID'); return; }
    try {
      if (editing) {
        await api('/console/accounts/' + encodeURIComponent(editing), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level, platform }),
        });
      } else {
        await api('/console/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountId, level, platform }),
        });
      }
      closeForm();
      await loadAccounts();
    } catch (e) {
      showMsg(e.message);
    }
  }

  async function remove(accountId) {
    if (!confirm('确认删除账号 ' + accountId + ' ？')) return;
    try {
      await api('/console/accounts/' + encodeURIComponent(accountId), { method: 'DELETE' });
      await loadAccounts();
    } catch (e) {
      alert(e.message);
    }
  }

  async function checkAccount(accountId) {
    const account = accounts.find(a => a.accountId === accountId);
    const platform = account ? (account.platform || 'steam') : 'steam';
    try {
      const r = await api('/console/ban-check?player=' + encodeURIComponent(accountId) + '&platform=' + encodeURIComponent(platform));
      if (r.success) {
        await loadAccounts();
        alert('已更新 ' + accountId + '：' + (r.banStatus || '未封禁') + (r.level ? ' · ' + r.level : ''));
      } else {
        alert('查询失败：' + (r.error || '未知错误'));
      }
    } catch (e) {
      alert(e.message);
    }
  }

  // 批量查询所有账号的封禁状态与等级并回填，完成后刷新列表。
  async function batchCheck() {
    const btn = $('batch-check');
    if (!accounts.length) { alert('还没有账号，先添加账号'); return; }
    if (!confirm('将逐个查询全部 ' + accounts.length + ' 个账号的封禁状态与等级，耗时可能较长，确认继续？')) return;
    btn.disabled = true;
    btn.textContent = '查询中…';
    try {
      const j = await api('/console/accounts/batch-check', { method: 'POST' });
      await loadAccounts();
      const lines = (j.results || []).map(r =>
        r.success
          ? r.accountId + '：' + (r.banStatus || '未知') + (r.level ? ' · ' + r.level : '')
          : r.accountId + '：查询失败（' + (r.error || '未知') + '）');
      alert('批量查询完成：成功 ' + j.success + ' / 失败 ' + j.failed + ' / 共 ' + j.total + '\n\n' + lines.join('\n'));
    } catch (e) {
      alert('批量查询失败：' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '批量查询';
    }
  }

  $('tbody').addEventListener('click', e => {
    const checkBtn = e.target.closest('[data-check]');
    const editBtn = e.target.closest('[data-edit]');
    const delBtn = e.target.closest('[data-del]');
    if (checkBtn) {
      checkAccount(checkBtn.getAttribute('data-check'));
    } else if (editBtn) {
      const accountId = editBtn.getAttribute('data-edit');
      const account = accounts.find(a => a.accountId === accountId);
      if (account) openForm(account);
    } else if (delBtn) {
      remove(delBtn.getAttribute('data-del'));
    }
  });
  $('new').addEventListener('click', () => openForm(null));
  $('batch-check').addEventListener('click', batchCheck);
  $('cancel').addEventListener('click', closeForm);
  $('save').addEventListener('click', save);
  $('log-query').addEventListener('click', () => { logOffset = 0; loadLogs(); });
  $('log-reset').addEventListener('click', () => {
    $('log-player').value = '';
    $('log-date').value = todayStr();
    $('log-limit').value = '20';
    logOffset = 0;
    loadLogs();
  });
  $('log-prev').addEventListener('click', () => {
    logOffset = Math.max(0, logOffset - parseInt($('log-limit').value || '20', 10));
    loadLogs();
  });
  $('log-next').addEventListener('click', () => {
    logOffset += parseInt($('log-limit').value || '20', 10);
    loadLogs();
  });
  $('log-limit').addEventListener('change', () => { logOffset = 0; loadLogs(); });

  $('log-date').value = todayStr();
  load();
</script>
<script src="/layout.js"></script>
</body>
</html>
