<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · feishu-bot-proxy</title>
<style>
  :root { --bg:#f1f3f7; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; --accent:#4f46e5;
          --grad:linear-gradient(135deg,#6366f1,#4f46e5); --danger:#dc2626; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(1200px 600px at 50% -10%, #e0e7ff, var(--bg));
         padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; color:var(--text);
         -webkit-tap-highlight-color:transparent; }
  .card { width:340px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:32px 28px; box-shadow:0 1px 2px rgba(16,24,40,.06), 0 20px 40px rgba(16,24,40,.12); }
  h1 { font-size:20px; margin:0 0 4px; }
  h1::before { content:''; display:inline-block; width:12px; height:12px; border-radius:4px; background:var(--grad); margin-right:10px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  label { display:block; font-size:13px; margin-bottom:6px; color:var(--muted); }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #eef2ff; }
  button { width:100%; padding:11px; background:var(--grad); color:#fff; border:none; border-radius:10px;
           font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(79,70,229,.28); }
  button:hover { filter:brightness(1.05); }
  button:disabled { opacity:.6; cursor:default; }
  .remember { display:flex; align-items:center; gap:8px; margin:-6px 0 16px; font-size:13px;
              color:var(--muted); user-select:none; cursor:pointer; }
  .remember input { width:auto; margin:0; accent-color:var(--accent); }
  #error { color:var(--danger); font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>后台登录</h1>
    <p class="sub">feishu-bot-proxy 管理控制台</p>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="remember"> 记住密码</label>
    <button type="submit" id="submit">登录</button>
    <div id="error"></div>
  </form>
<script>
  // 已登录就直接进菜单页。
  fetch('/console/session').then(r => r.json()).then(j => {
    if (j && j.authenticated) location.replace('/home.html');
  }).catch(() => {});

  // 记住密码：回填上次勾选「记住密码」后保存的用户名和密码（明文存在 localStorage）。
  const REMEMBER_KEY = 'feishuProxy.remember';
  try {
    const saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
    if (saved && saved.username) {
      document.getElementById('username').value = saved.username || '';
      document.getElementById('password').value = saved.password || '';
      document.getElementById('remember').checked = !!saved.password;
    }
  } catch (e) { /* 数据损坏或隐私模式下 localStorage 不可用，静默忽略 */ }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit');
    const err = document.getElementById('error');
    err.textContent = '';
    btn.disabled = true;
    try {
      const body = new URLSearchParams(new FormData(e.target));
      const res = await fetch('/console/login', { method: 'POST', body });
      const j = await res.json().catch(() => null);
      if (res.ok) {
        // 登录成功：勾选则保存，未勾选则清除。
        try {
          if (document.getElementById('remember').checked) {
            localStorage.setItem(REMEMBER_KEY, JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            }));
          } else {
            localStorage.removeItem(REMEMBER_KEY);
          }
        } catch (e) { /* localStorage 不可用时忽略 */ }
        location.replace('/home.html');
        return;
      }
      err.textContent = (j && j.msg) || ('登录失败 (' + res.status + ')');
    } catch (ex) {
      err.textContent = '网络错误，请重试';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
