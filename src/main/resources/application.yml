server:
  # 优先跟随 Render 注入的 PORT 环境变量；本地没设 PORT 时回落 8080。
  port: ${PORT:8080}
  tomcat:
    # 免费档内存紧，压工作线程数以省原生线程栈；本代理流量小，50 足够。
    threads:
      max: 50
  servlet:
    session:
      timeout: 8h            # 后台登录会话时长
      cookie:
        http-only: true      # JSESSIONID 不让前端脚本读取
        same-site: lax

spring:
  application:
    name: feishu-bot-proxy
#  profiles:
#    active: local

feishu:
  # POST /webhook（路径里不带 botKey）走哪个机器人。
  # 与 feishu.bots 一样，只是首次启动的种子：bot 表为空时导入一次，此后以数据库为准。
  default-bot: dev-group

  # 非空 => 调用方必须带上匹配的 X-Api-Token 请求头。留空 => 不鉴权（内网默认）。
  access-token: ""

  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  max-body-bytes: 20480          # 飞书拒收超过 20KB 的报文

  retry:
    max-attempts: 3
    initial-backoff-ms: 500
    multiplier: 2.0
    max-backoff-ms: 5000
    retryable-codes: [9499, 19003, 11232]   # 11232 是租户级限流，整点/半点高发

  rate-limit:
    enabled: true
    per-minute: 100              # 飞书限制，按机器人计
    per-second: 5                # 飞书限制，按机器人计
    wait-timeout-ms: 1000        # 等令牌最多阻塞这么久，超时就返回 429

  store:
    # 走 Supabase 的 Session Pooler（IPv4，适配 Render）。启动前需先对库执行 db/schema.sql 建表。
    jdbc-url: ${FEISHU_STORE_JDBC_URL:}   # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
    username: ${FEISHU_STORE_USERNAME:}
    password: ${FEISHU_STORE_PASSWORD:}

  # 后台管理界面（/login.html、/console.html）的登录账号
  admin:
    username: ${FEISHU_ADMIN_USERNAME:admin}
    password: ${FEISHU_ADMIN_PASSWORD:}   # 留空 => 后台登录不可用

  # 存活告警的全局设置；告警规则本身在后台「告警配置」页增删改
  alert:
    check-interval-ms: 600000              # 告警调度器两轮检查之间的间隔（毫秒），10 分钟一次

  # 账号封禁状态批量巡检：按固定周期把账号表所有账号查一遍封禁状态与等级并回填、写 ban_check_log。
  ban-check:
    interval-ms: 1800000                   # 两轮巡检之间的间隔（毫秒），30 分钟一次

  # 老数据修复调度：按固定周期把旧行烧错的可读时间列（create_datetime / queried_datetime）
  # 按权威 epoch 列重算回填。幂等，改完后的轮次不再动任何行。
  repair:
    interval-ms: 3600000                   # 两轮修复之间的间隔（毫秒）

# 日志级别统一在 src/main/resources/logback-spring.xml 里管理（控制台 + logs/app.log）。
